<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Task Management Dashboard - Quản lý công việc tối giản, hiện đại và chuẩn Responsive."
    />
    <title>Task Management Dashboard</title>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Overlay Backdrop dành cho Drawer Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- Dashboard Layout Container (CSS Grid) -->
    <div class="dashboard-layout">
      <!-- ASIDE: Navigation Sidebar -->
      <aside class="sidebar" id="sidebar" aria-label="Thanh điều hướng chính">
        <div class="sidebar-header">
          <button
            type="button"
            class="icon-btn sidebar-toggle-btn"
            id="sidebarToggleBtn"
            aria-label="Đóng/Mở Sidebar"
            title="Đóng/Mở Sidebar"
          >
            <svg
              class="ui-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <span class="sidebar-brand-name">TaskFlow</span>
        </div>

        <nav class="sidebar-nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a
                href="#home"
                class="nav-link active"
                title="Trang chủ"
                aria-current="page"
              >
                <svg
                  class="ui-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                  ></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-text">Trang chủ</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#projects" class="nav-link" title="Dự án">
                <svg
                  class="ui-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span class="nav-text">Dự án</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="#schedule" class="nav-link" title="Lịch trình">
                <svg
                  class="ui-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="nav-text">Lịch trình</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <a href="#settings" class="nav-link" title="Cài đặt">
            <svg
              class="ui-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
            <span class="nav-text">Cài đặt</span>
          </a>
        </div>
      </aside>

      <!-- MAIN: Khu vực nội dung chính -->
      <main class="main-content">
        <!-- HEADER: Lời chào cá nhân hóa (line-clamp-2) & Đồng hồ Real-time -->
        <header class="app-header">
          <div class="header-left">
            <!-- Nút Hamburger Menu dành riêng cho Mobile -->
            <button
              type="button"
              class="mobile-menu-btn"
              id="mobileMenuBtn"
              aria-label="Mở menu điều hướng"
            >
              <svg
                class="ui-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>

            <div class="greeting-container">
              <h1 class="personalized-greeting" id="personalizedGreeting">
                Chào Phúc, hôm nay bạn thế nào?
              </h1>
              <span class="greeting-subtitle"
                >Chúc bạn một ngày làm việc hiệu quả và tràn đầy năng
                lượng!</span
              >
            </div>
          </div>

          <div class="header-right">
            <!-- Đồng hồ thời gian thực (Giờ/Phút/Giây) chạy bằng setInterval -->
            <div class="clock-badge" aria-label="Đồng hồ thời gian thực">
              <svg
                class="clock-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <time id="liveClock" class="clock-display" datetime="00:00:00"
                >00:00:00</time
              >
            </div>
          </div>
        </header>

        <!-- SECTION: Input Section (Flexbox) - Ô nhập công việc và nút Thêm -->
        <section class="task-input-section" aria-label="Nhập công việc mới">
          <form class="task-form" id="taskForm" autocomplete="off" novalidate>
            <div class="input-pill-wrapper">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                type="text"
                id="taskInput"
                class="task-input-pill"
                placeholder="Nhập công việc cần làm..."
                maxlength="120"
                aria-label="Tên công việc mới"
              />
            </div>
            <button
              type="submit"
              class="add-task-btn"
              id="addTaskBtn"
              aria-label="Thêm công việc"
              title="Thêm công việc"
            >
              <svg
                class="plus-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </form>
        </section>

        <!-- SECTION: Task List Board (YOUR PROJECT Card) -->
        <section
          class="project-board-card"
          aria-label="Bảng danh sách công việc"
        >
          <div class="board-header">
            <div class="board-title-group">
              <h2 class="board-title">Task List</h2>
            </div>

            <!-- BỘ LỌC TASK (FILTER): Tất cả / Chưa xong / Đã xong -->
            <div
              class="filter-group"
              role="tablist"
              aria-label="Bộ lọc trạng thái công việc"
            >
              <button
                type="button"
                class="filter-btn active"
                data-filter="all"
                role="tab"
                aria-selected="true"
              >
                Tất cả
              </button>
              <button
                type="button"
                class="filter-btn"
                data-filter="active"
                role="tab"
                aria-selected="false"
              >
                Chưa xong
              </button>
              <button
                type="button"
                class="filter-btn"
                data-filter="completed"
                role="tab"
                aria-selected="false"
              >
                Đã xong
              </button>
            </div>
          </div>

          <!-- Danh sách Task (<ul>) -->
          <div class="task-list-wrapper">
            <ul class="task-list" id="taskList" role="list">
              <!-- Được render động từ JavaScript -->
            </ul>
          </div>
        </section>

        <!-- FOOTER: Đếm tổng số công việc -->
        <footer class="dashboard-footer">
          <div class="task-counter-pill">
            <span class="counter-label">Tổng số công việc:</span>
            <strong class="counter-value" id="taskCount">0</strong>
          </div>
        </footer>
      </main>
    </div>

    <!-- JavaScript file -->
    <script src="script.js"></script>
  </body>
</html>
